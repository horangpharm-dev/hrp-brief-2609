<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>호랑팜 보고서 열람</title>
<style>
:root{--brand:#57534D;--action:#3A55B4;--bg:#FAF9F7;--card:#FFFFFF;--line:#E7E3DC;--tint:#F3F1EC;--muted:#736D63;--body:#4A453D;--ink:#292520;--danger:#C2402F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:32px 32px 28px;width:100%;max-width:420px}
.band{display:flex;align-items:center;gap:10px;color:var(--brand);font-weight:700;letter-spacing:.04em;font-size:13px;margin-bottom:18px}
.band i{display:inline-block;width:10px;height:10px;background:var(--brand);border-radius:2px}
h1{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);letter-spacing:.08em}
input:focus{outline:2px solid var(--action);outline-offset:1px;border-color:var(--action)}
button{margin-top:12px;width:100%;font:inherit;font-size:15px;font-weight:600;padding:11px;border:0;border-radius:7px;background:var(--action);color:#fff;cursor:pointer;transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 120ms}
button:hover{background:color-mix(in srgb,var(--action) 92%,#000)}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:13px;min-height:18px}
.msg.err{color:var(--danger)}
.foot{margin-top:20px;padding-top:12px;border-top:2px solid var(--brand);font-size:11.5px;color:var(--muted)}
</style>
</head>
